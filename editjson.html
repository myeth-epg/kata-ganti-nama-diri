    <style>
        :root {
            --bg-main: #1e1e22;
            --bg-header: #25252b;

            --border-color: #3f3f46;

            --text-muted: #94a3b8;
            --accent-blue: #60a5fa;
            --accent-orange: #fb923c;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;

            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .header-title h1 {
            font-size: 1.25em;
            color: var(--accent-blue);
            font-weight: 800;
        }
        .header-sub {
            font-size: 0.82em;
            color: var(--text-muted);
            margin-top: 2px;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .ctrl-input, .ctrl-select {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 0.9em;
            outline: none;
        }
        .ctrl-input:focus, .ctrl-select:focus { border-color: var(--accent-blue); }
        .btn {
            border: none;

            padding: 8px 14px;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-save { background: #16a34a; color: #fff; }
        .btn-add { background: #2563eb; color: #fff; }
        .btn-del { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 0.8em; }
        .btn-card-save { background: #0284c7; color: #fff; padding: 6px 12px; font-size: 0.82em; }
        .btn-card-save.saved { background: #16a34a; }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .status-bar {
            background: #27272e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.88em;
            color: var(--text-muted);
        }
        .q-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .q-card-top {

            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .q-index-badge {
            background: #1e3a5f;

            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85em;
        }
        .row-grid-4 {

        }
        .row-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-label {
            font-size: 0.76em;
            font-weight: 700;
            color: var(--text-muted);
        }
        .field-input {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.92em;
            width: 100%;
            outline: none;
        }
        .field-input:focus { border-color: var(--accent-blue); }
        .field-answer { color: #4ade80; font-weight: 800; }
        .field-sentence { color: #f8fafc; font-weight: 600; }
        .field-zh { color: var(--accent-orange); }

        @media (max-width: 780px) {

[{"id": "A001", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "( ________ ) berjanji akan belajar bersungguh-sungguh demi mencapai keputusan yang cemerlang dalam peperiksaan.", "answer": "Saya", "distractors": ["Kamu", "Beliau", "Mereka"], "explanation_zh": "第一人称单数代词（我），用于向老师、长辈或正式场合表达自己的承诺。", "translation_zh": "我承诺会努力学习，以在考试中取得优异的成绩。"}, {"id": "A002", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Bilakah ( ________ ) akan bertolak ke Kuala Lumpur?\" tanya Encik Razak kepada rakan sekerjanya.", "answer": "kamu", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称单数代词（你），用于直接询问对方（同事）何时出发。", "translation_zh": "“你什么时候出发去吉隆坡？”拉扎克先生问他的同事。"}, {"id": "A003", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Sultan Mahmud telah berangkat ke majlis perasmian itu dan ( ________ ) diiringi oleh beberapa orang pembesar negeri.", "answer": "baginda", "distractors": ["beliau", "tuanku", "beta"], "explanation_zh": "第三人称尊称代词（陛下/殿下），专门用来指代苏丹、国王或王室成员。", "translation_zh": "苏丹马末已启程前往开幕典礼，多位州大臣随行护送。"}, {"id": "A004", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Ampun tuanku, ( ________ ) menjunjung titah perintah tuanku,\" sembah Laksamana Hang Tuah.", "answer": "patik", "distractors": ["beta", "saya", "hamba"], "explanation_zh": "第一人称谦称代词（臣/微臣），古代臣子或百姓向苏丹/国王说话时自称。", "translation_zh": "“启禀陛下，微臣谨遵陛下的旨意。”海军统帅汉都亚叩拜道。"}, {"id": "A005", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Murid-murid tahun enam itu sangat rajin dan ( ________ ) sering mendapat pujian daripada guru besar.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代前文提到的“六年级学生们”（Murid-murid）。", "translation_zh": "那些六年级学生非常勤奋，他们经常得到校长的称赞。"}, {"id": "A006", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Sebagai rakyat yang cinta akan negara, ( ________ ) hendaklah sentiasa mematuhi undang-undang.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），用于呼吁大家共同遵守法律。", "translation_zh": "作为热爱国家的公民，我们应当时刻遵守法律。"}, {"id": "A007", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Wahai rakyat jelata, ( ________ ) berharap agar semua penduduk hidup dalam keadaan aman dan damai,\" titah Sultan Ahmad.", "answer": "beta", "distractors": ["patik", "baginda", "tuanku"], "explanation_zh": "第一人称皇室自称（朕/孤），专门用于苏丹或国王对臣民说话时的自称。", "translation_zh": "“亲爱的子民们，朕希望所有居民都能生活在安宁与和平之中。”苏丹阿末谕示道。"}, {"id": "A008", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Mengapakah ( ________ ) datang lewat ke latihan bola jaring petang ini?\" tanya Cikgu Suraya kepada Ali.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），苏拉雅老师直接问阿里一个人为何迟到。", "translation_zh": "“为什么你今天下午的英式女篮训练迟到了？”苏拉雅老师问阿里。"}, {"id": "A009", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Encik Lim seorang dermawan yang terkenal dan ( ________ ) sering menghulurkan bantuan kepada anak-anak yatim.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他/她），用于指代受人尊敬的长辈、老师、医生或慈善家（Encik Lim）。", "translation_zh": "林先生是一位著名的慈善家，他经常向孤儿伸出援手。"}, {"id": "A010", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Ayah, bolehkah ( ________ ) meminjam basikal abang untuk ke kedai?\" tanya Adib kepada ayahnya.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），阿迪礼貌地向父亲自称并请求借用脚踏车。", "translation_zh": "“爸爸，我可以借哥哥的脚踏车去商店吗？”阿迪问他的爸爸。"}, {"id": "A011", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "( ________ ) berdua akan mewakili sekolah dalam pertandingan bahas peringkat daerah pada minggu hadapan.", "answer": "Kami", "distractors": ["Mereka", "Kalian", "Saya"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），表示“我们两个人”将代表学校参赛。", "translation_zh": "我们两人将在下周代表学校参加县级辩论比赛。"}, {"id": "A012", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Sila duduk di tempat masing-masing sementara ( ________ ) mengambil buku kehadiran,\" kata ketua kelas kepada rakan-rakannya.", "answer": "saya", "distractors": ["kalian", "mereka", "beliau"], "explanation_zh": "第一人称单数代词（我），班长请同学们先坐好，自己（我）去拿点名簿。", "translation_zh": "“请大家先回到各自的座位坐好，我去拿点名簿。”班长对同学们说。"}, {"id": "A013", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Perdana Menteri akan merasmikan kempen kebersihan itu dan ( ________ ) dijadualkan tiba pada pukul 9:00 pagi.", "answer": "beliau", "distractors": ["baginda", "dia", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代国家领袖、部长或受尊敬的人士（Perdana Menteri 首相）。", "translation_zh": "首相将为该清洁运动主持开幕，他预计于上午9时抵达。"}, {"id": "A014", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Janganlah ( ________ ) bersedih lagi, segala yang berlaku pasti ada hikmahnya,\" pujuk Aina kepada sahabatnya.", "answer": "kamu", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称单数代词（你），艾娜安慰她的好朋友（一个人）不要再难过。", "translation_zh": "“你别再难过了，凡事发生必有其深意。”艾娜安慰她的好友。"}, {"id": "A015", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Para pekerja kilang itu sedang mogok kerana ( ________ ) tidak berpuas hati dengan bayaran gaji yang rendah.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代前文的“工厂工人们”（Para pekerja kilang）。", "translation_zh": "那些工厂工人正在罢工，因为他们对微薄的薪资感到不满。"}, {"id": "A016", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Daulat tuanku, semoga ( ________ ) sentiasa dikurniakan kesihatan yang baik,\" ucap Datuk Bendahara.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），臣子直接向苏丹或国王祝祷时使用“tuanku”。", "translation_zh": "“吾王万岁，愿陛下永远身体健康。”宰相（拿督盘陀诃罗）祝贺道。"}, {"id": "A017", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "( ________ ) mestilah menghormati ibu bapa dan guru-guru yang telah banyak berjasa kepada kita.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），与句末的“kita”前后呼应。", "translation_zh": "我们必须尊敬对我们付出良多的父母和老师们。"}, {"id": "A018", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Saya berasal dari negeri Pahang. Bolehkah ( ________ ) tahu nama tempat ini?\" tanya pengembara itu.", "answer": "saya", "distractors": ["kamu", "dia", "kita"], "explanation_zh": "第一人称单数代词（我），旅人礼貌地向人询问：“我可以知道这个地方的名字吗？”", "translation_zh": "“我来自彭亨州。请问我可以知道这个地方的名称吗？”那位旅人问道。"}, {"id": "A019", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Puan Salmah merupakan guru disiplin di sekolah ini dan ( ________ ) sangat tegas tetapi penyayang.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代受人尊敬的老师（Puan Salmah）。", "translation_zh": "萨尔玛女士是这所学校的纪律老师，她非常严厉但充满爱心。"}, {"id": "A020", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Jika ( ________ ) tidak faham tentang topik ini, sila angkat tangan untuk bertanya,\" pesan Cikgu Hafiz kepada murid-muridnya.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），哈菲兹老师对全班“同学们”（murid-muridnya）说话。", "translation_zh": "“如果你们对这个课题有不明白的地方，请举手提问。”哈菲兹老师叮嘱学生们。"}, {"id": "A021", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Mei Ling dan Siti sedang mengulang kaji pelajaran di perpustakaan kerana ( ________ ) akan menduduki ujian esok.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（她们），指代“美玲和茜蒂”（Mei Ling dan Siti）两个人。", "translation_zh": "美玲和茜蒂正在图书馆温习功课，因为她们明天要参加测验。"}, {"id": "A022", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Mak, ( ________ ) laparlah. Bilakah makanan tengah hari akan siap?\" rengek adik yang baru pulang dari tadika.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），弟弟刚从幼儿园放学回家，向妈妈撒娇说“我饿了”。", "translation_zh": "“妈妈，我好饿啊。午餐什么时候准备好？”刚从幼儿园回家的弟弟撒娇道。"}, {"id": "A023", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Walaupun sudah berjaya menjadi doktor, ( ________ ) tidak pernah melupakan jasa kedua-dua ibu bapanya.", "answer": "beliau", "distractors": ["saya", "mereka", "baginda"], "explanation_zh": "第三人称尊称代词（他/她），用于指代有成就、受尊敬的人士（医生）。", "translation_zh": "尽管已经成功成为一名医生，他从未忘记父母亲的养育之恩。"}, {"id": "A024", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Wahai saudara-saudaraku, marilah ( ________ ) berganding bahu membersihkan kawasan surau ini,\" seru ketua kampung.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），“marilah kita”意为“让我们一起……”。", "translation_zh": "“各位乡亲父老们，让我们一起携手清理这间祈祷室的周围环境吧！”村长号召道。"}, {"id": "A025", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Penjenayah yang berbahaya itu akhirnya berjaya diberkas oleh pihak polis setelah ( ________ ) bersembunyi di dalam hutan.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），罪犯（Penjenayah）不应用尊称“beliau”，因此使用普通第三人称“dia”。", "translation_zh": "那名危险的罪犯在躲藏于森林之中后，最终成功被警方逮捕。"}, {"id": "A026", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Ibu, ( ________ ) hendak keluar bermain bola sepak di padang sebentar,\" kata Haikal kepada ibunya.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），海卡尔向母亲报备自己要出去草场踢一会儿足球。", "translation_zh": "“妈妈，我要出去草场踢一会儿足球。”海卡尔对他的妈妈说。"}, {"id": "A027", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Doktor Amirul merawat pesakitnya dengan penuh dedikasi kerana ( ________ ) sangat komited dengan tugasnya.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人尊敬的专业人士（阿米鲁医生）。", "translation_zh": "阿米鲁医生
