"distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），娜比拉直接询问美华（一个人）何时归还故事书。", "translation_zh": "“你什么时候归还前几天借的故事书？”娜比拉问美华。"}, {"id": "A039", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "Tun Dr. Mahathir merupakan bekas Perdana Menteri Malaysia dan ( ________ ) digelar Bapa Pemodenan.", "answer": "beliau", "distractors": ["baginda", "dia", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人尊敬的前首相敦马哈迪医生。", "translation_zh": "敦马哈迪医生是马来西亚前首相，他被称为“现代化之父”。"}, {"id": "A040", "group": "A", "category": "Group A: Kata Ganti Nama Diri", "sentence": "\"Marilah ( ________ ) berdoa agar negara kita sentiasa dilindungi daripada sebarang bencana,\" kata imam masjid itu kepada para jemaah.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括伊玛目与所有信徒），“Marilah kita”意为“让我们一起……”。", "translation_zh": "“让我们一起祈祷，愿我们的国家永远免受任何灾难的侵袭。”清真寺伊玛目对信众们说。"}, {"id": "B001", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Cikgu, bolehkah ( ________ ) keluar ke tandas sebentar?\" tanya Wei Ming kepada Cikgu Lim.", "answer": "saya", "distractors": ["kamu", "dia", "beliau"], "explanation_zh": "第一人称单数代词（我），伟明礼貌地向林老师请求去洗手间。", "translation_zh": "“老师，我可以出去上一下洗手间吗？”伟明问林老师。"}, {"id": "B002", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Cikgu Siti telah mengajar di sekolah ini selama dua puluh tahun dan ( ________ ) sangat disayangi oleh murid-murid.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代受人尊敬的老师（Cikgu Siti）。", "translation_zh": "西蒂老师在这所学校执教已有二十年，她深受学生们的爱戴。"}, {"id": "B003", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Penduduk kampung itu bergotong-royong membersihkan longkang supaya kawasan ( ________ ) bebas daripada nyamuk Aedes.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代前文的“甘榜居民”（Penduduk kampung）。", "translation_zh": "那个甘榜的居民合力清理水沟，以使他们的居住环境免受黑斑蚊滋扰。"}, {"id": "B004", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Marilah ( ________ ) sama-sama menjaga kebersihan taman permainan ini,\" kata Mei Fen kepada kawan-kawannya.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），“Marilah kita”表示邀请大家一起行动。", "translation_zh": "“让我们一起维护这个游乐场的清洁吧！”美芬对朋友们说。"}, {"id": "B005", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) sekeluarga akan bercuti ke Pulau Langkawi pada cuti sekolah yang akan datang.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），表示“我们一家人”要去度假。", "translation_zh": "我们一家人将在即将到来的学校假期前往浮罗交怡度假。"}, {"id": "B006", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Sultan Selangor telah berkenan merasmikan jambatan baharu itu dan ( ________ ) turut meluangkan masa beramah mesra dengan rakyat.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室尊称（陛下），用于叙述苏丹或国王的举动。", "translation_zh": "雪兰莪苏丹御准为那座新桥主持开幕，陛下也抽空与民众亲切交流。"}, {"id": "B007", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Wahai para pembesar, ( ________ ) mahu negara kita sentiasa aman dan makmur,\" titah Sultan Mansor.", "answer": "beta", "distractors": ["patik", "baginda", "tuanku"], "explanation_zh": "第一人称皇室自称（朕/孤），苏丹曼苏尔向大臣们发表谕令时使用。", "translation_zh": "“众位大臣，朕希望我们的国家永远和平繁荣。”苏丹曼苏尔谕示道。"}, {"id": "B008", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Ampun tuanku, ( ________ ) akan melaksanakan segala perintah tuanku dengan segera,\" sembah Hang Lekir.", "answer": "patik", "distractors": ["beta", "saya", "hamba"], "explanation_zh": "第一人称谦称代词（微臣），臣子向苏丹禀告时自称“patik”。", "translation_zh": "“启禀陛下，微臣将立即执行陛下的所有命令。”汉勒基尔叩拜道。"}, {"id": "B009", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Segala titah perintah ( ________ ) akan patik laksanakan dengan penuh taat setia,\" ucap Bendahara Tun Perak.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），臣子直接称呼眼前的苏丹或国王时使用“tuanku”。", "translation_zh": "“陛下的所有谕令，微臣必将尽忠职守地执行。”宰相敦霹雳说道。"}, {"id": "B010", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Pastikan ( ________ ) membawa alat tulis yang lengkap pada hari peperiksaan nanti,\" pesan guru kelas kepada murid-muridnya.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），班主任叮嘱全班多位学生（murid-muridnya）。", "translation_zh": "“确保你们在考试当天携带齐全的文具。”级任老师叮嘱学生们。"}, {"id": "B011", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Mengapakah ( ________ ) tidak dijemput ke majlis hari lahir kamu semalam?\" tanya Amir kepada sahabat karibnya, Johan.", "answer": "aku", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），用于关系非常亲密的好友（sahabat karib）之间交谈。", "translation_zh": "“为什么昨天你的生日派对没有邀请我？”阿米尔问他的挚友约翰。"}, {"id": "B012", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Bilakah ( ________ ) hendak menghantar buku latihan Matematik kepada Cikgu Tan?\" tanya Farah kepada sahabatnya, Siti.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），用于同辈朋友之间亲切礼貌地询问对方。", "translation_zh": "“你什么时候要交数学练习簿给陈老师？”法拉问她的朋友茜蒂。"}, {"id": "B013", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Sila pastikan ( ________ ) memakai tali pinggang keledar semasa memandu,\" pesan pihak polis kepada orang ramai.", "answer": "anda", "distractors": ["saya", "mereka", "beliau"], "explanation_zh": "第二人称正式代词（您/各位），常用于官方通告、广告或警方对公众的提醒。", "translation_zh": "“请确保您在驾驶时系好安全带。”警方提醒广大民众。"}, {"id": "B014", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Adik menangis dengan kuat kerana ( ________ ) terjatuh dari basikal di halaman rumah.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他/她），用于指代普通人或小孩（Adik 弟弟/妹妹）。", "translation_zh": "弟弟大声哭泣，因为他在屋前院子从脚踏车上摔了下来。"}, {"id": "B015", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Dato' Lee Chong Wei merupakan bekas pemain badminton negara yang terkenal dan ( ________ ) telah mengharumkan nama Malaysia.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人敬重的国家体坛名将（拿督李宗伟）。", "translation_zh": "拿督李宗伟是著名的前国家羽毛球选手，他为马来西亚争光。"}, {"id": "B016", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) mestilah mengamalkan gaya hidup sihat dengan bersenam sekurang-kurangnya tiga kali seminggu.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），倡导大家共同保持健康生活。", "translation_zh": "我们必须通过每周至少运动三次来实践健康的生活方式。"}, {"id": "B017", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Cikgu, ( ________ ) berlima telah menyiapkan tugasan projek Sains ini,\" kata ketua kumpulan kepada Cikgu Zaki.", "answer": "kami", "distractors": ["kita", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的老师），组长代表五位组员向老师汇报。", "translation_zh": "“老师，我们五个人已经完成了这项科学专题作业。”组长对扎基老师说。"}, {"id": "B018", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Kanak-kanak itu kelihatan sangat gembira semasa ( ________ ) bermain layang-layang di tepi pantai.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代前文的复数名词“Kanak-kanak”（孩子们）。", "translation_zh": "那些孩子们在海边放风筝时看起来非常开心。"}, {"id": "B019", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Di manakah ( ________ ) meletakkan kunci rumah kita tadi?\" tanya Karim kepada adiknya, Rahim.", "answer": "engkau", "distractors": ["aku", "dia", "kami"], "explanation_zh": "第二人称单数代词（你），哥哥卡林对亲弟弟拉欣说话时使用较为亲近随意的“engkau”。", "translation_zh": "“你刚才把我们家的钥匙放在哪里了？”卡林问他的弟弟拉欣。"}, {"id": "B020", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Maafkan ( ________ ), mak cik. Saya tidak sengaja terpijak kaki mak cik,\" kata budak perempuan itu dengan sopan.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），小女孩礼貌地向阿姨道歉，与下文的“Saya”一致。", "translation_zh": "“对不起，阿姨。我不是故意踩到您的脚的。”那位小女孩有礼貌地说。"}, {"id": "B021", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) sedang bersemayam di atas singgahsana sambil mendengar sembah daripada para pembesar.", "answer": "Baginda", "distractors": ["Beliau", "Beta", "Patik"], "explanation_zh": "第三人称皇室尊称（陛下），“bersemayam di atas singgahsana”（端坐在宝座上）为皇室专用动词。", "translation_zh": "陛下正端坐在宝座上，聆听众大臣的禀报。"}, {"id": "B022", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) dilantik sebagai Guru Besar Sekolah Jenis Kebangsaan Cina Chung Hua pada awal tahun ini.", "answer": "Beliau", "distractors": ["Dia", "Baginda", "Mereka"], "explanation_zh": "第三人称尊称代词（他/她），用于指代受人尊敬的校长（Guru Besar）。", "translation_zh": "他/她于今年初被委任为中华华小的校长。"}, {"id": "B023", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) sedang berlatih bersungguh-sungguh untuk menghadapi perlawanan bola keranjang esok.", "answer": "Mereka", "distractors": ["Kami", "Saya", "Beliau"], "explanation_zh": "第三人称复数代词（他们），篮球队比赛需要多人参赛，故用复数“Mereka”。", "translation_zh": "他们正在努力训练，以迎接明天的篮球比赛。"}, {"id": "B024", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Mengapakah muka ( ________ ) kelihatan pucat hari ini, Hui Ling?\" tanya Cikgu Nora dengan penuh prihatin.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），诺拉老师关切地询问慧玲一个人为何脸色苍白。", "translation_zh": "“慧玲，为什么你今天脸色看起来这么苍白？”诺拉老师关切地问道。"}, {"id": "B025", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Izinkan ( ________ ) berehat di pondok ini buat seketika kerana hari sudah senja,\" kata pengembara itu kepada pemilik pondok.", "answer": "hamba", "distractors": ["beta", "tuanku", "beliau"], "explanation_zh": "第一人称古典谦称（在下/小人），古代或古典故事中平民百姓互相交谈时谦虚自称“hamba”。", "translation_zh": "“天色已晚，请允许在下在这间茅屋暂歇片刻。”那位旅人对屋主说道。"}, {"id": "B026", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Walaupun Ahmad sering diejek oleh rakan-rakannya, ( ________ ) tetap bersabar dan tidak pernah berputus asa.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代同辈学生阿末（Ahmad）。", "translation_zh": "尽管阿末经常被同学们嘲笑，他依然保持耐心，从不轻言放弃。"}, {"id": "B027", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Ayuh, ( ________ ) bersihkan kelas ini bersama-sama sebelum loceng berbunyi!\" ajak ketua darjah kepada rakan sekelasnya.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括班长与全班同学），号召大家一起打扫课室。", "translation_zh": "“来吧，让我们在铃声响起前一起打扫这间课室！”班长号召全班同学。"}, {"id": "B028", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Ibu, bolehkah ( ________ ) berdua pergi ke rumah nenek pada hujung minggu ini?\" tanya Aiman dan adiknya.", "answer": "kami", "distractors": ["kita", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的妈妈），艾曼和弟弟两人一起向妈妈请求。", "translation_zh": "“妈妈，这个周末我们两人可以去奶奶家吗？”艾曼和弟弟问道。"}, {"id": "B029", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Semua murid tahun lima dikehendaki berkumpul di dewan kerana ( ________ ) akan mendengar ceramah kesihatan,\" kata juruacara.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），司仪直接对全体五年级学生广播指示。", "translation_zh": "“所有五年级学生请到礼堂集合，因为你们将聆听健康讲座。”司仪说道。"}, {"id": "B030", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Jika diizinkan oleh tuanku, ( ________ ) ingin memohon cuti selama tiga hari,\" sembah Panglima Awang.", "answer": "patik", "distractors": ["beta", "saya", "baginda"], "explanation_zh": "第一人称谦称代词（微臣），将军阿旺向苏丹/陛下请假时必须自称“patik”。", "translation_zh": "“若蒙陛下恩准，微臣想请假三天。”阿旺将军叩禀道。"}, {"id": "B031", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Oleh sebab jasa bakti kalian, ( ________ ) akan mengurniakan pingat kebesaran,\" titah Sultan Iskandar.", "answer": "beta", "distractors": ["patik", "tuanku", "baginda"], "explanation_zh": "第一人称皇室自称（朕），苏丹依斯干达封赏有功之臣时自称“beta”。", "translation_zh": "“鉴于你们的功绩，朕将赐予勋章。”苏丹依斯干达谕示道。"}, {"id": "B032", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Rakyat jelata amat menyayangi ( ________ ) kerana pemerintahan yang adil dan saksama,\" ucap seorang menteri kepada Sultan.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），大臣面对苏丹当面赞颂时称呼“tuanku”。", "translation_zh": "“百姓们非常爱戴陛下，因为陛下治国有方、公正不阿。”一位大臣对苏丹说道。"}, {"id": "B033", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) suka membaca buku cerita berbahasa Melayu pada waktu lapang untuk menambahkan ilmu pengetahuan.", "answer": "Saya", "distractors": ["Kamu", "Beliau", "Mereka"], "explanation_zh": "第一人称单数代词（我），句首用于自我介绍或陈述个人兴趣爱好。", "translation_zh": "我喜欢在空闲时间阅读马来文故事书以增加知识。"}, {"id": "B034", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Menteri Pendidikan itu akan melawat ke sekolah kami minggu hadapan dan ( ________ ) akan merasmikan bangunan baharu.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他/她），用于指代教育部长（Menteri Pendidikan）等国家领导人。", "translation_zh": "教育部长下周将莅临我校访问，并主持新教学楼的开幕仪式。"}, {"id": "B035", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Encik Tan dan Puan Lim sangat bangga apabila anak-anak ( ________ ) berjaya melanjutkan pelajaran ke universiti.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“陈先生和林女士”（Encik Tan dan Puan Lim）夫妇二人。", "translation_zh": "当他们的孩子成功升入大学深造时，陈先生和林女士感到非常自豪。"}, {"id": "B036", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Kucing kesayangan Aini hilang semalam, tetapi ( ________ ) berjaya menemuinya semula di belakang rumah.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（她），指代女孩艾妮（Aini）成功找回了心爱的猫咪。", "translation_zh": "艾妮心爱的猫咪昨天走失了，但她成功在屋后重新找到了它。"}, {"id": "B037", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Burung kakak tua itu sangat bijak kerana ( ________ ) boleh meniru suara manusia.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），专门用于指代动物、植物或无生命的事物（鹦鹉）。", "translation_zh": "那只鹦鹉非常聪明，因为它能够模仿人类的声音。"}, {"id": "B038", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) tidak dapat menghadiri majlis perkahwinan itu kerana terpaksa pulang ke kampung pada hari yang sama.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者/主人家），说明“我们”因回乡而无法出席婚礼。", "translation_zh": "我们无法出席那场婚礼，因为当天必须赶回乡下。"}, {"id": "B039", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Hadiah misteri menanti ( ________ ) jika berjaya menjawab semua soalan kuiz ini dengan betul!\" seru pengacara rancangan itu.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式/大众代词（您/各位观众），节目主持人面向广大观众或参与者时常用“anda”。", "translation_zh": "“只要您成功答对所有问答题目，神秘礼物正等着您！”节目主持人热情地说道。"}, {"id": "B040", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Sudikah ( ________ ) menemani saya ke kedai buku selepas waktu sekolah nanti?\" tanya Mei Mei kepada kawan baiknya.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），美美礼貌地询问她的好朋友是否愿意陪自己去书店。", "translation_zh": "“放学后你愿意陪我一起去书店吗？”美美问她的好朋友。"}, {"id": "B041", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Profesor Dr. Halim telah menjalankan kajian selama lima tahun sebelum ( ________ ) menemui penawar penyakit tersebut.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人敬重的学者与专家（哈林教授博士）。", "translation_zh": "哈林教授博士进行了长达五年的研究，最终找到了该疾病的解药。"}, {"id": "B042", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "( ________ ) haruslah menghargai jasa para pejuang kemerdekaan yang sanggup berkorban demi tanah air tercinta.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括所有人），呼吁全体国民铭记独立先贤的付出。", "translation_zh": "我们应当珍惜那些愿意为心爱祖国牺牲的独立斗士们的功绩。"}, {"id": "B043", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Para pelancong asing itu sangat kagum melihat keindahan Pulau Tioman dan ( ________ ) berjanji akan datang lagi.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代前文的复数群体“外国游客们”（Para pelancong asing）。", "translation_zh": "那些外国游客对刁曼岛的美景赞叹不已，并承诺一定会再来。"}, {"id": "B044", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Siapakah yang telah membantu ( ________ ) menyiapkan lukisan yang cantik ini, Chong Wei?\" tanya ibunya.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），妈妈直接询问宗伟一个人是谁帮他完成画作的。", "translation_zh": "“宗伟，是谁帮你完成这幅漂亮的画作的？”他的妈妈问道。"}, {"id": "B045", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Esok ( ________ ) dan abang akan pergi memancing ikan di sungai,\" kata Azlan kepada sahabat rapatnya, Faizal.", "answer": "aku", "distractors": ["kamu", "dia", "beliau"], "explanation_zh": "第一人称单数代词（我），阿兹兰对挚友法依扎说话时用亲近随意的“aku”。", "translation_zh": "“明天我和哥哥要去河边钓鱼。”阿兹兰对他的挚友法依扎说。"}, {"id": "B046", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Permaisuri Agong kelihatan anggun mengenakan pakaian tradisional dan ( ________ ) tersenyum manis kepada orang ramai.", "answer": "baginda", "distractors": ["beliau", "tuanku", "beta"], "explanation_zh": "第三人称皇室尊称（陛下/王后殿下），用于指代国家元首后（Permaisuri Agong）。", "translation_zh": "国家元首后身穿传统服饰显得端庄优雅，陛下向民众露出了甜美的微笑。"}, {"id": "B047", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Janganlah ( ________ ) membuang sampah merata-rata di kawasan taman sains ini,\" tegur Cikgu Bala kepada sekumpulan murid.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），巴拉老师对着一群学生（sekumpulan murid）劝告不要乱丢垃圾。", "translation_zh": "“你们不要在这个科学园四周乱丢垃圾。”巴拉老师劝告一群学生。"}, {"id": "B048", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Bolehkah ( ________ ) mencuba baju kurung yang berwarna biru itu, puan?\" tanya pelanggan kepada jurujual.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），顾客礼貌地向女店员询问是否可以试穿蓝色的马来套装。", "translation_zh": "“女士，我可以试穿那件蓝色的马来传统套装吗？”顾客问店员。"}, {"id": "B049", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "Pemuda yang menyelamatkan kanak-kanak lemas itu dipuji ramai kerana ( ________ ) sangat berani dan pantas bertindak.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代前文提到的那位救人的年轻男子（Pemuda）。", "translation_zh": "那位救起溺水儿童的青年受到众人称赞，因为他非常勇敢且行动迅速。"}, {"id": "B050", "group": "B", "category": "Group B: Kata Ganti Nama Diri", "sentence": "\"Terima kasih atas bantuan yang telah tuan berikan kepada ( ________ ) sekeluarga,\" ucap Encik Yusof kepada jirannya.", "answer": "kami", "distractors": ["kita", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的邻居），尤索夫先生代表自己一家人向邻居道谢。", "translation_zh": "“谢谢先生给予我们一家人的帮助。”尤索夫先生向他的邻居致谢。"}, {"id": "C001", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Cikgu Wong, ( ________ ) ingin meminjam buku cerita ini untuk dibaca di rumah,\" kata Jia Xuan.", "answer": "saya", "distractors": ["kamu", "dia", "mereka"], "explanation_zh": "第一人称单数代词（我），佳轩礼貌地向黄老师自称并请求借书。", "translation_zh": "“黄老师，我想借这本故事书回家阅读。”佳轩说道。"}, {"id": "C002", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Guru Besar SJK(C) Sin Min menyampaikan ucapan pada perhimpunan pagi dan ( ________ ) menasihati murid supaya rajin belajar.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他/她），用于指代受人尊敬的华小学校校长（Guru Besar）。", "translation_zh": "新民华小的校长在周会上致词，并劝勉学生们要勤奋学习。"}, {"id": "C003", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) mesti menyiapkan kerja sekolah sebelum menonton televisyen,\" pesan ibu kepada Boon Keat.", "answer": "Kamu", "distractors": ["Saya", "Dia", "Beliau"], "explanation_zh": "第二人称单数代词（你），妈妈叮嘱文杰一个人必须先完成功课。", "translation_zh": "“你必须在看电视之前完成功课。”妈妈叮嘱文杰。"}, {"id": "C004", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Ah Meng dan Muthu berkawan baik sejak tahun satu dan ( ________ ) selalu berjalan kaki ke sekolah bersama-sama.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“阿明和穆都”（Ah Meng dan Muthu）两个人。", "translation_zh": "阿明和穆都从一年级起就是好朋友，他们经常一起走路去上学。"}, {"id": "C005", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) berdua ditugaskan untuk menyapu lantai kelas pada hari ini,\" kata Shu Ting dan Yee Ling kepada ketua kelas.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的班长），表示“我们两人”今天负责扫地。", "translation_zh": "“我们两人今天被分配负责扫教室的地板。”淑婷和依琳对班长说。"}, {"id": "C006", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Kawan-kawan, marilah ( ________ ) beratur dengan kemas sebelum masuk ke dewan sekolah,\" kata pengawas itu.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），“marilah kita”邀请大家一起排队。", "translation_zh": "“朋友们，让我们在进入学校礼堂前先整齐排队吧。”那位巡察员说道。"}, {"id": "C007", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Adik lelaki saya berumur lima tahun dan ( ________ ) sangat suka melukis gambar haiwan.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代年幼的弟弟（Adik lelaki）。", "translation_zh": "我的弟弟今年五岁，他非常喜欢画动物的图画。"}, {"id": "C008", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Murid-murid, sila buka buku teks Bahasa Melayu ( ________ ) pada muka surat dua puluh,\" arah Cikgu Lim.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），林老师指示全班同学们（Murid-murid）翻开国语课本。", "translation_zh": "“同学们，请翻开你们的国语课本第20页。”林老师指示道。"}, {"id": "C009", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Ayah bekerja sebagai seorang jurutera dan ( ________ ) selalu pulang lewat pada waktu malam.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受尊敬的长辈或专业人士（爸爸）。", "translation_zh": "爸爸是一名工程师，他晚上经常很晚才回家。"}, {"id": "C010", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Ibu, ( ________ ) telah mendapat markah penuh dalam ujian ejaan tadi!\" jerit Mei Ling dengan gembira.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），美玲开心地向妈妈报喜。", "translation_zh": "“妈妈，我刚才的听写测验拿了满分！”美玲开心地喊道。"}, {"id": "C011", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Kucing putih milik keluarga kami sangat manja dan ( ________ ) suka tidur di atas sofa.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），用于指代动物（白色的猫咪）。", "translation_zh": "我们家的白猫非常粘人，它喜欢睡在沙发上。"}, {"id": "C012", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Mengapakah ( ________ ) tidak hadir ke sekolah semalam, Siva?\" tanya Cikgu Tan.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），陈老师询问西瓦一个人昨天为何缺席。", "translation_zh": "“西瓦，你昨天为什么没有来上学？”陈老师问道。"}, {"id": "C013", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "( ________ ) sekeluarga akan pergi melawat ke rumah datuk di Melaka pada hujung minggu ini.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），表示“我们一家人”要去马六甲探望爷爷。", "translation_zh": "我们一家人这个周末将去马六甲探望爷爷。"}, {"id": "C014", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Sebagai murid yang berdisiplin, ( ________ ) patut mematuhi semua peraturan sekolah,\" kata Cikgu Nor kepada murid-murid.", "answer": "kita", "distractors": ["kami", "mereka", "beliau"], "explanation_zh": "第一人称复数代词（我们——包括老师和全体学生），诺老师勉励大家共同遵守校规。", "translation_zh": "“作为有纪律的学生，我们应当遵守所有的校规。”诺老师对学生们说。"}, {"id": "C015", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Abang sedang mengulang kaji pelajaran di biliknya kerana ( ________ ) akan menduduki peperiksaan SPM tidak lama lagi.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代哥哥（Abang）。", "translation_zh": "哥哥正在房间里温习功课，因为他不久后就要参加SPM考试了。"}, {"id": "C016", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Para guru di sekolah ini sangat berdedikasi dan ( ________ ) sentiasa membimbing murid dengan penuh kesabaran.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代复数名词“老师们”（Para guru）。", "translation_zh": "这所学校的老师们非常敬业，他们总是耐心地教导学生。"}, {"id": "C017", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) berharap agar semua murid tahun enam dapat menjaga nama baik sekolah,\" pesan Guru Penolong Kanan.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Mereka"], "explanation_zh": "第一人称单数代词（我），副校长对六年级学生表达自己的期望。", "translation_zh": "“我希望所有六年级学生都能维护学校的良好声誉。”副校长叮嘱道。"}, {"id": "C018", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Bilakah ( ________ ) hendak pergi ke perpustakaan bersama-sama dengan saya?\" tanya Xin Yi kepada rakan karibnya, Pei Shan.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），欣仪亲切地问好朋友佩珊何时一起去图书馆。", "translation_zh": "“你什么时候要和我一起去图书馆？”欣仪问她的挚友佩珊。"}, {"id": "C019", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Nenek pandai membuat kuih tradisional dan ( ________ ) sering mengajar ibu cara membuatnya.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代受尊敬的长辈（奶奶）。", "translation_zh": "奶奶擅长制作传统糕点，她经常教妈妈制作的方法。"}, {"id": "C020", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) mesti berjanji tidak akan mengulangi kesilapan ini lagi,\" kata ayah kepada Amirul.", "answer": "Kamu", "distractors": ["Saya", "Dia", "Beliau"], "explanation_zh": "第二人称单数代词（你），爸爸严厉地要求阿米鲁一个人做出承诺。", "translation_zh": "“你必须保证以后不再重犯这个错误。”爸爸对阿米鲁说。"}, {"id": "C021", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Terima kasih kerana sudi datang ke majlis hari lahir ( ________ ),\" kata Zhi Hao kepada rakan-rakannya.", "answer": "saya", "distractors": ["kamu", "dia", "mereka"], "explanation_zh": "第一人称单数代词（我），志豪感谢朋友们来参加“我的”生日会。", "translation_zh": "“谢谢你们愿意来参加我的生日派对。”志豪对朋友们说。"}, {"id": "C022", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Kakak sangat gembira apabila ( ________ ) terpilih sebagai ketua pasukan bola tampar sekolah.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（她），指代姐姐（Kakak）。", "translation_zh": "当姐姐被选为学校排球队队长时，她感到非常开心。"}, {"id": "C023", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Janganlah ( ________ ) berasa malu untuk bertanya jika tidak faham,\" kata Cikgu Chong kepada murid-murid kelas 4B.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），张老师鼓励4B班的同学们勇敢发问。", "translation_zh": "“如果有不明白的地方，你们不要不好意思发问。”张老师对4B班的学生们说。"}, {"id": "C024", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Ibu bapa saya bekerja keras setiap hari kerana ( ________ ) mahu memberikan pendidikan yang terbaik kepada kami.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“我的父母”（Ibu bapa saya）。", "translation_zh": "我的父母每天辛勤工作，因为他们想给我们提供最好的教育。"}, {"id": "C025", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) akan memastikan kawasan kantin sentiasa bersih,\" ikrar murid-murid sekolah itu.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），学生们向师长宣誓“我们”会保持食堂清洁。", "translation_zh": "“我们一定会确保食堂周围时刻保持清洁。”该校的学生们宣誓道。"}, {"id": "C026", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Pokok mangga di halaman rumah datuk sudah tua, namun ( ________ ) masih berbuah lebat setiap musim.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），用于指代植物（芒果树）。", "translation_zh": "爷爷院子里的那棵芒果树已经老了，但它每个季节仍然结满果实。"}, {"id": "C027", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Apakah hobi ( ________ ) pada waktu lapang, Jun Jie?\" tanya guru Bahasa Melayu.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），国语老师询问俊杰个人的业余爱好。", "translation_zh": "“俊杰，你在空闲时间有什么爱好？”国语老师问道。"}, {"id": "C028", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Puan Ong merupakan guru sains yang berpengalaman dan ( ________ ) sering menjalankan eksperimen yang menarik.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），指代经验丰富、受人尊敬的王老师（Puan Ong）。", "translation_zh": "王女士是一位经验丰富的科学老师，她经常进行有趣的实验。"}, {"id": "C029", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Wahai sahabatku, mari ( ________ ) ulang kaji pelajaran Matematik bersama-sama di pondok bacaan,\" ajak Li Hua.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括丽华与朋友），邀请朋友一起温习数学。", "translation_zh": "“好朋友，我们一起去阅读亭温习数学吧！”丽华邀请道。"}, {"id": "C030", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "( ________ ) berjanji akan menolong ibu mencuci pinggan mangkuk selepas makan malam nanti.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Beliau"], "explanation_zh": "第一人称单数代词（我），表达自己主动帮忙做家务的承诺。", "translation_zh": "我答应晚饭后会帮妈妈洗碗碟。"}, {"id": "C031", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Mengapakah ( ________ ) menangis di tepi koridor itu, adik?\" tanya seorang pengawas perempuan.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），女巡察员关心地问哭泣的小同学。", "translation_zh": "“小弟弟/小妹妹，你为什么在走廊边哭泣？”一位女巡察员问道。"}, {"id": "C032", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Datuk saya pernah menjadi askar dahulu dan ( ________ ) sangat berani mempertahankan negara.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），指代曾保卫国家、受尊敬的长辈（爷爷）。", "translation_zh": "我的爷爷以前当过兵，他曾非常勇敢地保卫国家。"}, {"id": "C033", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Tolong hantarkan buku latihan Sains ini ke bilik guru untuk ( ________ ),\" kata Cikgu Goh kepada ketua kelas.", "answer": "saya", "distractors": ["kamu", "dia", "mereka"], "explanation_zh": "第一人称单数代词（我），吴老师请班长把科学作业簿送到办公室给“我”。", "translation_zh": "“请帮我把这些科学练习簿送到教师办公室。”吴老师对班长说。"}, {"id": "C034", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Kawan-kawan sekelas saya sangat peramah dan ( ________ ) sentiasa membantu murid baharu menyesuaikan diri.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“同班同学们”（Kawan-kawan sekelas）。", "translation_zh": "我的同班同学们非常友善，他们总是帮助新同学适应环境。"}, {"id": "C035", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) berempat akan menyertai pertandingan bercerita peringkat negeri minggu hadapan,\" kata Zi Xuan kepada gurunya.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的老师），紫轩向老师报告她们四人的参赛计划。", "translation_zh": "“我们四人下周将参加州级讲故事比赛。”紫轩对她的老师说。"}, {"id": "C036", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Sila simpan semua buku cerita selepas ( ________ ) selesai membacanya,\" pesan pustakawan kepada murid-murid.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），图书管理员叮嘱多名学生（murid-murid）阅毕收好书籍。", "translation_zh": "“请你们在看完故事书后把书收好。”图书管理员叮嘱学生们。"}, {"id": "C037", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Hui Min rajin berlatih bermain piano setiap petang kerana ( ________ ) bercita-cita menjadi ahli muzik.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（她），指代同龄学生慧敏（Hui Min）。", "translation_zh": "慧敏每天下午都勤奋练习弹钢琴，因为她的志向是成为一名音乐家。"}, {"id": "C038", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Ayuh, ( ________ ) bersatu padu menjayakan sambutan Hari Guru pada tahun ini!\" seru pengerusi kelab.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括社团主席与所有成员），呼吁大家同心协力办好教师节。", "translation_zh": "“来吧，让我们团结一致，把今年的教师节庆典办好！”学会主席号召道。"}, {"id": "C039", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) mesti berhati-hati semasa melintas jalan raya di hadapan sekolah,\" nasihat pengawal keselamatan kepada budak itu.", "answer": "Kamu", "distractors": ["Saya", "Dia", "Beliau"], "explanation_zh": "第二人称单数代词（你），保安叔叔叮嘱那位小同学过马路要小心。", "translation_zh": "“你在过校门前的马路时一定要小心。”保安人员劝告那个小孩。"}, {"id": "C040", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Bapa saudara saya seorang doktor pakar dan ( ________ ) bertugas di Hospital Kuala Lumpur.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代长辈及专业人士（叔叔/伯父，专科医生）。", "translation_zh": "我的叔叔是一名专科医生，他在吉隆坡医院任职。"}, {"id": "C041", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Ibu, ( ________ ) sudah mengemas katil dan menyapu bilik tidur,\" kata Xiao Mei dengan bangga.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），小美自豪地告诉妈妈自己已经整理好房间。", "translation_zh": "“妈妈，我已经整理好床铺并扫好卧室了。”小美自豪地说。"}, {"id": "C042", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Di manakah ( ________ ) membeli kamus bahasa Melayu yang baharu ini?\" tanya Yi Lin kepada rakan sekelasnya.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），艺琳礼貌地问同班同学在哪里买的新马来文词典。", "translation_zh": "“你是在哪里买这本新的马来文词典的？”艺琳问她的同班同学。"}, {"id": "C043", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Murid-murid tahun empat sedang membuat projek sains di makmal dan ( ________ ) bekerjasama dengan baik.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“四年级的学生们”（Murid-murid tahun empat）。", "translation_zh": "四年级的学生们正在科学室做科学专题作业，他们合作得很好。"}, {"id": "C044", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"( ________ ) ingin mengucapkan selamat hari lahir kepada cikgu,\" kata Wen Qi sambil menghulurkan sekeping kad.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Mereka"], "explanation_zh": "第一人称单数代词（我），文琪递上生日卡向老师祝贺。", "translation_zh": "“我想祝老师生日快乐。”文琪一边递出卡片一边说道。"}, {"id": "C045", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Anjing peliharaan Encik Chong sangat setia dan ( ________ ) sentiasa menjaga keselamatan rumah tuannya.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代动物（张先生饲养的狗）。", "translation_zh": "张先生养的狗非常忠心，它总是守护着主人的家宅安全。"}, {"id": "C046", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Marilah ( ________ ) berdoa agar nenek cepat sembuh,\" kata kakak kepada adik-adiknya.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括姐姐和弟妹们），一起为奶奶祈祷早日康复。", "translation_zh": "“让我们一起祈祷奶奶早日康复吧。”姐姐对弟妹们说。"}, {"id": "C047", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Cikgu, ( ________ ) semua sudah bersedia untuk memulakan persembahan tarian,\" kata ketua pasukan.", "answer": "kami", "distractors": ["kita", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的老师），队长向老师汇报全体队员已准备好。", "translation_zh": "“老师，我们大家都已经准备好开始舞蹈表演了。”队长说道。"}, {"id": "C048", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Pak Cik Ismail menjual nasi lemak di kantin sekolah dan ( ________ ) sangat ramah dengan semua murid.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），指代学校食堂受学生敬重的长辈（伊斯迈叔叔）。", "translation_zh": "伊斯迈叔叔在学校食堂卖椰浆饭，他对所有学生都非常亲切。"}, {"id": "C049", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "\"Harap ( ________ ) semua dapat bersabar sementara menunggu bas sekolah tiba,\" kata cikgu bertugas.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），值日老师安抚正在等候校车的多位学生。", "translation_zh": "“希望你们大家在等待校车到达时能保持耐心。”值日老师说道。"}, {"id": "C050", "group": "C", "category": "Group C: Sekolah & Keluarga (校园与家庭)", "sentence": "Wei Kang mendapat tempat pertama dalam pertandingan melukis kerana ( ________ ) sangat berbakat.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代小选手伟康（Wei Kang）。", "translation_zh": "伟康在绘画比赛中获得了第一名，因为他非常有天赋。"}, {"id": "D001", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Sebagai rakyat Malaysia, ( ________ ) haruslah menjaga kebersihan alam sekitar,\" seru pengacara kempen hijau.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括所有马来西亚公民），呼吁大家共同爱护环境。", "translation_zh": "“作为马来西亚公民，我们应当保护环境清洁。”绿色环保运动主持人号召道。"}, {"id": "D002", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Anggota bomba itu dipuji oleh masyarakat kerana ( ________ ) berani menyelamatkan mangsa kebakaran.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受社会敬重、英勇救人的消防员。", "translation_zh": "那位消防员受到社会大众的赞扬，因为他勇敢地救出了火灾受困者。"}, {"id": "D003", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Sila buang sampah ke dalam tong kitar semula yang telah disediakan untuk keselesaan ( ________ ),\" tulis papan tanda itu.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您），常见于公共告示牌，提醒大众为了“您的”舒适而把垃圾丢进回收桶。", "translation_zh": "“为了您的舒适，请将垃圾丢入已准备好的再循环垃圾桶内。”告示牌上写着。"}, {"id": "D004", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Penduduk Taman Sentosa bekerjasama membersihkan balai raya supaya ( ________ ) dapat menggunakannya dengan selesa.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代圣淘沙花园的居民们（Penduduk Taman Sentosa）。", "translation_zh": "圣淘沙花园的居民合力打扫民众会堂，以便他们能舒适地使用。"}, {"id": "D005", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) akan mendermakan pakaian lama ini kepada mangsa banjir,\" kata Encik Tan dan keluarganya.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），陈先生一家人表示要把旧衣物捐给水灾灾民。", "translation_zh": "“我们将把这些旧衣服捐赠给水灾灾民。”陈先生和家人说道。"}, {"id": "D006", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Pemuda yang jujur itu memulangkan dompet yang dijumpainya kepada pemilik asal kerana ( ________ ) tidak mahu mengambil hak orang lain.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代捡到钱包并归还的诚实青年（Pemuda）。", "translation_zh": "那位诚实的青年把捡到的钱包归还给原主，因为他不想拿别人的东西。"}, {"id": "D007", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Terima kasih, adik. ( ________ ) memang seorang budak yang baik hati,\" puji nenek tua itu sambil tersenyum.", "answer": "Kamu", "distractors": ["Saya", "Dia", "Beliau"], "explanation_zh": "第二人称单数代词（你），老奶奶微笑着称赞帮她的小朋友。", "translation_zh": "“谢谢你，小朋友。你真是个善良的好孩子。”那位老奶奶微笑着称赞道。"}, {"id": "D008", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) berharap agar jiran-jiran di taman ini sentiasa hidup bermuafakat,\" kata ketua rukun tetangga.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Mereka"], "explanation_zh": "第一人称单数代词（我），睦邻计划主席表达自己的期望。", "translation_zh": "“我希望这个花园住宅区的邻居们能够永远和睦相处。”睦邻计划主席说道。"}, {"id": "D009", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Doktor Kavitha merawat pesakit di klinik desa dengan penuh kasih sayang dan ( ________ ) tidak pernah merungut penat.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代受敬重的卡维塔医生（Doktor Kavitha）。", "translation_zh": "卡维塔医生充满爱心地在乡区诊所治疗病人，她从不抱怨疲累。"}, {"id": "D010", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Wahai penduduk kampung, marilah ( ________ ) menanam pokok di sepanjang jalan ini,\" ajak Tok Penghulu.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括村长与全体村民），号召大家一起种树绿化环境。", "translation_zh": "“各位村民，让我们一起沿着这条路种树吧！”村长邀请道。"}, {"id": "D011", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Sungai di belakang kampung itu sangat penting kerana ( ________ ) membekalkan air bersih kepada penduduk.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代自然事物（甘榜后面的那条河 Sungai）。", "translation_zh": "甘榜后面的那条河流非常重要，因为它为居民提供干净的水源。"}, {"id": "D012", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Jika ( ________ ) ternampak kebakaran, sila hubungi pihak bomba dengan segera,\" pesan pegawai bomba kepada orang ramai.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您/各位），消防官员向公众宣导防火安全。", "translation_zh": "“如果您发现火灾，请立即致电消防局。”消防官员提醒公众。"}, {"id": "D013", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Pekerja pembersihan itu bangun awal setiap pagi dan ( ________ ) membersihkan jalan raya demi keselesaan bersama.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），句中表示清洁工人们每天早起清扫马路（也可指群体的工作）。", "translation_zh": "那些清洁工人每天清晨早起，为了大家的舒适而清扫马路。"}, {"id": "D014", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Janganlah ( ________ ) membazirkan air dan elektrik di rumah,\" pesan ibu kepada anak-anaknya.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），妈妈叮嘱多个孩子（anak-anaknya）不要浪费水电。", "translation_zh": "“你们在家里不要浪费水和电。”妈妈叮嘱孩子们。"}, {"id": "D015", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Puan Zaleha aktif dalam kerja-kerja sukarelawan dan ( ________ ) sering membantu golongan warga emas.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代热心公益、受人敬重的扎丽哈女士。", "translation_zh": "扎丽哈女士积极参与志愿工作，她经常帮助乐龄人士。"}, {"id": "D016", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Maafkan ( ________ ), pak cik. Saya tidak nampak pak cik di belakang tadi,\" kata pemandu basikal itu.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），骑脚踏车的人礼貌地向大叔道歉。", "translation_zh": "“对不起，大叔。我刚才没有看到您在后面。”那位骑脚踏车的人说道。"}, {"id": "D017", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Budak lelaki yang membantu orang buta melintas jalan itu sangat mulia hatinya dan ( ________ ) wajar dicontohi.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代助人为乐的小男孩（Budak lelaki）。", "translation_zh": "那个扶盲人过马路的小男孩心地非常善良，他值得大家学习。"}, {"id": "D018", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "( ________ ) mestilah menghormati adat resam dan budaya pelbagai kaum di negara ini agar keamanan berkekalan.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括所有国民），呼吁大家互相尊重各族文化以维持和平。", "translation_zh": "我们必须尊重国内各族的风俗习惯与文化，以使和平得以延续。"}, {"id": "D019", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) sekeluarga baru sahaja berpindah ke taman perumahan ini semalam,\" kata Encik Lim kepada jiran baharunya.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的新邻居），林先生向新邻居自我介绍。", "translation_zh": "“我们一家人昨天才刚搬来这个住宅区。”林先生对他的新邻居说。"}, {"id": "D020", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Mengapakah ( ________ ) memetik bunga di taman awam ini, adik?\" tegur seorang pegawai majlis perbandaran.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），市议会官员制止并询问那位小朋友为何摘花。", "translation_zh": "“小朋友，你为什么在公共公园里摘花？”一位市议会官员劝阻道。"}, {"id": "D021", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Pegawai polis itu menjalankan tugasnya dengan amanah dan ( ________ ) sangat dihormati oleh penduduk setempat.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），指代尽忠职守、深受居民尊敬的警官（Pegawai polis）。", "translation_zh": "那位警官尽忠职守地执行任务，深受当地居民的尊敬。"}, {"id": "D022", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Sukarelawan dari pelbagai kaum berganding bahu membersihkan pantai kerana ( ________ ) mencintai keindahan alam.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代来自各族的“志愿者们”（Sukarelawan）。", "translation_zh": "来自不同族群的志愿者们携手清理海滩，因为他们热爱大自然的美景。"}, {"id": "D023", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Gunakanlah jejantas apabila ( ________ ) hendak melintas jalan raya yang sibuk ini,\" nasihat polis trafik kepada pengguna jalan raya.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您），交警向广大的道路使用者提出安全劝告。", "translation_zh": "“当您要横过这条繁忙的马路时，请使用行人天桥。”交警劝告道路使用者。"}, {"id": "D024", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) ingin mengucapkan ribuan terima kasih kepada semua penderma darah hari ini,\" kata pengarah hospital.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Mereka"], "explanation_zh": "第一人称单数代词（我），医院院长向今日的献血者致谢。", "translation_zh": "“我想向今天所有的献血者致以万分的谢意。”医院院长说道。"}, {"id": "D025", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Hutan hujan tropika sangat berharga kerana ( ________ ) menjadi habitat bagi pelbagai spesies flora dan fauna.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代无生命/自然生态（热带雨林 Hutan hujan tropika）。", "translation_zh": "热带雨林非常珍贵，因为它是各种动植物物种的栖息地。"}, {"id": "D026", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Ayuh, ( ________ ) gunakan beg kitar semula semasa membeli-belah untuk mengurangkan penggunaan beg plastik!\" kata Cikgu Yap.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括叶老师与大家），倡导一起使用环保袋。", "translation_zh": "“来吧，让我们在购物时使用环保袋，以减少塑料袋的使用！”叶老师说道。"}, {"id": "D027", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Ramesh membantu seorang warga emas membawa barang yang berat dan ( ________ ) berasa gembira dapat berbuat baik.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代乐于助人的学生拉美士（Ramesh）。", "translation_zh": "拉美士帮一位老人提重物，他因能行善而感到开心。"}, {"id": "D028", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Pastikan ( ________ ) mengunci pintu rumah sebelum keluar bercuti,\" pesan Puan Mei kepada anak-anaknya.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），梅女士叮嘱孩子们出门度假前锁好门。", "translation_zh": "“确保你们在出门度假前把家门锁好。”梅女士叮嘱孩子们。"}, {"id": "D029", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) telah mengumpulkan sebanyak lima puluh kilogram tin aluminium untuk dikitar semula,\" kata ahli-ahli kelab alam sekitar.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），环保学会会员汇报“我们”已收集了50公斤铝罐。", "translation_zh": "“我们已经收集了五十公斤的铝罐以供再循环。”环保学会会员们说道。"}, {"id": "D030", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Datuk Dr. Sheikh Muszaphar merupakan angkasawan pertama negara dan ( ________ ) menjadi inspirasi kepada generasi muda.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），指代国家首位宇航员拿督锡慕斯查法医生。", "translation_zh": "拿督锡慕斯查法医生是国家首位宇航员，他成为了年轻一代的榜样。"}, {"id": "D031", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Bilakah ( ________ ) hendak menghantar borang penyertaan larian amal itu, Hui Ling?\" tanya Jia Hao.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），家豪礼貌地询问同辈朋友慧敏何时提交义跑报名表格。", "translation_zh": "“慧敏，你什么时候要交那份慈善义跑的报名表格？”家豪问道。"}, {"id": "D032", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Para petani di kawasan itu sangat rajin dan ( ________ ) menanam pelbagai jenis sayur-sayuran segar.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“农夫们”（Para petani）。", "translation_zh": "那个地区的农夫们非常勤劳，他们种植了各种各样的新鲜蔬菜。"}, {"id": "D033", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Jika tidak keberatan, bolehkah ( ________ ) membantu nenek mengangkat bakul buah ini?\" tanya budak yang sopan itu.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），有礼貌的小孩主动询问奶奶是否可以由“我”帮忙提水果篮。", "translation_zh": "“如果不介意的话，我可以帮奶奶提这个水果篮吗？”那位有礼貌的孩子问道。"}, {"id": "D034", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) tidak boleh mementingkan diri sendiri dalam kehidupan bermasyarakat,\" kata Encik Ahmad dalam ceramahnya.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括讲者与所有听众），强调在社区生活中大家不能自私。", "translation_zh": "“我们在社区生活中不能只顾自己。”阿末先生在他的讲座中说道。"}, {"id": "D035", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Pemandu teksi itu memulangkan beg tangan penumpang yang tertinggal kerana ( ________ ) bersikap amanah.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代诚实归还手提包的出租车司机（Pemandu teksi）。", "translation_zh": "那位出租车司机归还了乘客遗留的手提包，因为他为人诚实可靠。"}, {"id": "D036", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Mengapakah ( ________ ) membuang botol plastik itu ke dalam longkang, Ah Chong?\" tegur rakannya.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），朋友直接质问并劝阻阿聪（一个人）把塑料瓶丢进水沟。", "translation_zh": "“阿聪，你为什么把那个塑料瓶丢进水沟里？”他的朋友劝阻道。"}, {"id": "D037", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Menteri Alam Sekitar telah melancarkan kempen bebas plastik dan ( ________ ) menyeru rakyat agar menyokong usaha tersebut.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他/她），指代环境部长（Menteri Alam Sekitar）。", "translation_zh": "环境部长推介了无塑料运动，并呼吁人民支持这项努力。"}, {"id": "D038", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Sila pastikan ( ________ ) menutup paip air dengan rapat selepas mencuci tangan,\" tulis poster di tandas awam.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您），常见于公共场所的宣传海报或标语。", "translation_zh": "“请确保您在洗手后把水龙头关紧。”公共厕所的海报上写着。"}, {"id": "D039", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) berasa sangat gembira dapat menyumbangkan tenaga dalam program gotong-royong ini,\" kata pasukan pengakap.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），童子军队表达“我们”能参与大扫除感到非常开心。", "translation_zh": "“我们很高兴能够在这项大扫除活动中贡献一份力量。”童子军队伍说道。"}, {"id": "D040", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Jiran-jiran di Lorong Mawar saling menghormati dan ( ________ ) sering bertukar-tukar juadah semasa musim perayaan.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代玫瑰巷的邻居们（Jiran-jiran）。", "translation_zh": "玫瑰巷的邻居们互相尊重，他们在佳节期间经常互相交换美食。"}, {"id": "D041", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Wahai anak-anak muda, ( ________ ) ialah harapan bangsa dan negara pada masa hadapan,\" kata tokoh masyarakat itu.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），社会贤达对着一群“年轻人”（anak-anak muda）发表勉励。", "translation_zh": "“年轻人们，你们是国家和民族未来的希望。”那位社会贤达说道。"}, {"id": "D042", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Tong sampah pintar yang dicipta oleh pelajar universiti itu sangat berguna kerana ( ________ ) dapat mengasingkan sisa secara automatik.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代发明物品（智能垃圾桶 Tong sampah pintar）。", "translation_zh": "那些大学生发明的智能垃圾桶非常有用，因为它能够自动分类垃圾。"}, {"id": "D043", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) berjanji akan menjaga haiwan peliharaan ini dengan penuh tanggungjawab,\" kata Yu Heng kepada ayahnya.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Beliau"], "explanation_zh": "第一人称单数代词（我），宇恒向爸爸保证自己会负责任地照顾宠物。", "translation_zh": "“我保证会负起责任好好照顾这只宠物。”宇恒对爸爸说。"}, {"id": "D044", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Cikgu Rosnah menubuhkan kelab kebajikan murid dan ( ________ ) berusaha membantu murid daripada keluarga kurang berkemampuan.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（她），用于指代充满爱心、受人敬重的罗斯娜老师。", "translation_zh": "罗斯娜老师成立了学生福利学会，她努力帮助来自清寒家庭的学生。"}, {"id": "D045", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Marilah ( ________ ) bergotong-royong membersihkan kawasan taman permainan ini supaya selamat untuk kanak-kanak,\" kata Encik Bala.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括巴拉先生和大家），号召大家共同清理游乐场。", "translation_zh": "“让我们一起合力清理这个游乐场，让孩子们能安全玩耍。”巴拉先生说道。"}, {"id": "D046", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Walaupun Ali berasal daripada keluarga yang miskin, ( ________ ) tidak pernah berasa malu dan sentiasa berusaha gigih.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），指代勤奋向上的少年阿里（Ali）。", "translation_zh": "虽然阿里来自贫困的家庭，但他从不感到自卑，并且总是加倍努力。"}, {"id": "D047", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Mengapakah ( ________ ) tidak mematikan suis kipas sebelum keluar dari bilik ini?\" tegur kakak kepada adiknya.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），姐姐提醒弟弟（一个人）离开房间前要关掉风扇开关。", "translation_zh": "“你为什么在离开这间房间前没有关掉风扇开关？”姐姐提醒弟弟。"}, {"id": "D048", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"Jika ( ________ ) memerlukan bantuan semasa berada di pusat beli-belah ini, sila ke kaunter pertanyaan,\" kata juruhebah.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您），商场广播员面向所有顾客发言时使用“anda”。", "translation_zh": "“如果您在这家购物中心需要任何协助，请前往询问处。”广播员说道。"}, {"id": "D049", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "\"( ________ ) berharap agar sumbangan kecil ini dapat meringankan beban keluarga Puan Wong,\" kata wakil persatuan penduduk.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的黄女士一家），居民协会代表表示“我们”的一点心意。", "translation_zh": "“我们希望这点微薄的捐助能够减轻黄女士一家的负担。”居民协会代表说道。"}, {"id": "D050", "group": "D", "category": "Group D: Masyarakat & Nilai (社区与道德)", "sentence": "Para doktor dan jururawat bertugas tanpa mengira masa kerana ( ________ ) mengutamakan nyawa pesakit.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“医生和护士们”（Para doktor dan jururawat）。", "translation_zh": "医生和护士们不分昼夜地值班，因为他们把病人的生命放在第一位。"}, {"id": "E001", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) amat berbesar hati melihat rakyat jelata hidup dalam suasana muhibah,\" titah Sultan Abdullah.", "answer": "Beta", "distractors": ["Patik", "Baginda", "Tuanku"], "explanation_zh": "第一人称皇室自称（朕），苏丹阿都拉对臣民说话时在句首自称“Beta”。", "translation_zh": "“朕看到子民们生活在和谐融洽的氛围中，感到十分欣慰。”苏丹阿都拉谕示道。"}, {"id": "E002", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Ampun tuanku, ( ________ ) memohon izin untuk berangkat pulang ke kampung halaman,\" sembah Laksamana Bentan.", "answer": "patik", "distractors": ["beta", "tuanku", "saya"], "explanation_zh": "第一人称谦称代词（微臣），大臣向苏丹请求准许回乡时必须自称“patik”。", "translation_zh": "“启禀陛下，微臣恳请准许启程返回故乡。”明丹海军统帅叩禀道。"}, {"id": "E003", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Sultan Perak telah berangkat ke majlis jamuan diraja dan ( ________ ) disambut meriah oleh para tetamu kehormat.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室尊称（陛下），在第三人称叙述中指代霹雳苏丹。", "translation_zh": "霹雳苏丹已抵达御宴会场，陛下受到了各位贵宾的热烈欢迎。"}, {"id": "E004", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Semoga ( ________ ) sentiasa berada dalam lindungan Tuhan,\" ucap Datuk Temenggung di hadapan Raja Melaka.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），天猛公在马六甲国王面前当面祝福国王时称呼“tuanku”。", "translation_zh": "“愿陛下永远得到上天的庇佑。”拿督天猛公在马六甲国王面前祝祷道。"}, {"id": "E005", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Jikalau tuan hamba sudi, marilah singgah di teratak buruk ( ________ ) ini,\" pelawa Pak Ali dalam cerita klasik itu.", "answer": "hamba", "distractors": ["beta", "tuanku", "beliau"], "explanation_zh": "第一人称古典谦称（在下），古典故事中平民老伯邀请客人到“在下的”简陋茅屋做客。", "translation_zh": "“若阁下不嫌弃，请到在下的简陋茅舍坐坐吧。”古典故事中的阿里伯父邀请道。"}, {"id": "E006", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Tunku Abdul Rahman dikenang sebagai Bapa Kemerdekaan kerana ( ________ ) telah memperjuangkan kemerdekaan Tanah Melayu.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受全马人民敬仰的国父东姑阿都拉曼（非苏丹王室成员）。", "translation_zh": "东姑阿都拉曼被铭记为“独立之父”，因为他为马来亚争取了独立。"}, {"id": "E007", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) berharap agar generasi muda menghargai sejarah perjuangan tokoh-tokoh terdahulu,\" kata guru sejarah itu.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Mereka"], "explanation_zh": "第一人称单数代词（我），历史老师表达自己的期望。", "translation_zh": "“我希望年轻一代能够珍惜先贤们奋斗的历史。”那位历史老师说道。"}, {"id": "E008", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Wahai sekalian hulubalang, bersiap sedialah ( ________ ) untuk mempertahankan kota ini daripada serangan musuh!\" seru panglima.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），将领对众勇士（sekalian hulubalang）下达备战指令。", "translation_zh": "“各位勇士们，你们做好准备，誓死保卫这座城池抵御敌军来袭！”将领号令道。"}, {"id": "E009", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Mengapakah ( ________ ) bermuram durja hari ini, wahai sahabatku?\" tanya Hang Jebat kepada Hang Tuah.", "answer": "engkau", "distractors": ["aku", "dia", "beliau"], "explanation_zh": "第二人称单数代词（你），古典/挚友语境中汉惹拔关切地询问挚友汉都亚。", "translation_zh": "“我的好朋友，你今天为何愁眉苦脸？”汉惹拔问汉都亚。"}, {"id": "E010", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Janganlah engkau risau, ( ________ ) akan sentiasa berada di sisimu ketika susah dan senang,\" balas Hang Tuah.", "answer": "aku", "distractors": ["kamu", "dia", "beliau"], "explanation_zh": "第一人称单数代词（我），与句中的“engkau”及“sisimu”相呼应。", "translation_zh": "“你别担心，无论顺境逆境，我都会永远站在你身边。”汉都亚回应道。"}, {"id": "E011", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Raja Perlis berkenan menyempurnakan upacara perasmian itu sebelum ( ________ ) berangkat pulang ke istana.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室尊称（陛下），指代玻璃市拉惹（Raja Perlis）。", "translation_zh": "玻璃市拉惹御准主持开幕仪式后，陛下便起驾回宫。"}, {"id": "E012", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Titah perintah ( ________ ) akan patik junjung setinggi-tingginya,\" ujar Bendahara Tun Mutahir.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），句中有“patik”自称，对皇室尊称必用“tuanku”。", "translation_zh": "“陛下的谕旨，微臣必当全力遵行。”宰相敦慕达希尔说道。"}, {"id": "E013", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) ingin menitahkan agar semua pembesar negeri berkumpul di balairung seri esok pagi,\" titah Sultan Muzaffar.", "answer": "Beta", "distractors": ["Patik", "Baginda", "Tuanku"], "explanation_zh": "第一人称皇室自称（朕），苏丹穆扎法尔下达谕令时自称“Beta”。", "translation_zh": "“朕要下旨，命所有州大臣明早齐集于大殿。”苏丹穆扎法尔谕示道。"}, {"id": "E014", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Para pahlawan Melaka berjuang dengan gagah berani sehingga ( ________ ) berjaya mengusir lanun dari perairan selat.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代英勇作战的“马六甲勇士们”（Para pahlawan Melaka）。", "translation_zh": "马六甲的勇士们英勇奋战，最终他们成功将海盗驱逐出海峡海域。"}, {"id": "E015", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) berdua akan memulakan pendakian Gunung Kinabalu pada awal pagi esok,\" kata Faris dan Daniel kepada jurupandu.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者或特指两人），法里斯和丹尼尔汇报登山计划。", "translation_zh": "“我们两人将于明早清晨开始攀登京那巴鲁山。”法里斯和丹尼尔对向导说。"}, {"id": "E016", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Marilah ( ________ ) menghayati erti kemerdekaan dengan penuh rasa syukur,\" kata guru besar pada bulan Ogos.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括校长与全校师生），在国庆月共同体会独立的意义。", "translation_zh": "“让我们怀着感恩的心，一起体会国家独立的意义。”校长在八月国庆月说道。"}, {"id": "E017", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Keris Taming Sari ialah senjata yang terkenal dalam sejarah Melayu dan ( ________ ) dikatakan mempunyai kesaktian.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代历史文物/武器（Keris Taming Sari 短剑）。", "translation_zh": "达明沙里马来短剑是马来历史上有名的武器，据说它具有神奇的力量。"}, {"id": "E018", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) memohon maaf sekiranya terdapat kekhilafan dalam sembah maklum tadi,\" ucap pembesar istana kepada Sultan.", "answer": "Patik", "distractors": ["Beta", "Tuanku", "Baginda"], "explanation_zh": "第一人称谦称代词（微臣），宫廷大臣在苏丹面前请罪道歉时自称“Patik”。", "translation_zh": "“若刚才微臣的奏报有任何疏漏之处，微臣恳请恕罪。”宫廷大臣对苏丹说道。"}, {"id": "E019", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Tun Tan Cheng Lock merupakan seorang tokoh negarawan dan ( ________ ) banyak menyumbang ke arah perpaduan kaum.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人敬重的马来西亚先贤（敦陈祯禄）。", "translation_zh": "敦陈祯禄是一位杰出的政治家，他为促进各族团结做出了巨大贡献。"}, {"id": "E020", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Sila semak jawapan ( ________ ) dengan teliti sebelum menghantar kertas peperiksaan,\" pesan pengawas peperiksaan.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），监考官提醒考场里的所有考生（复数）仔细检查答案。", "translation_zh": "“在交上考卷之前，请你们仔细检查自己的答案。”监考官叮嘱道。"}, {"id": "E021", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Pencuri yang memecah masuk ke dalam kedai emas itu berjaya ditahan setelah ( ________ ) terperangkap di tingkat atas.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他），小偷（Pencuri）属负面人物，不可用尊称“beliau”，必须用“dia”。", "translation_zh": "潜入金店行窃的小偷在被困于楼上后，成功遭到警方逮捕。"}, {"id": "E022", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Bolehkah ( ________ ) mengetahui nama penuh tuan sebelum mendaftarkan maklumat ini?\" tanya pegawai kaunter kepada Encik Wong.", "answer": "saya", "distractors": ["kamu", "dia", "kami"], "explanation_zh": "第一人称单数代词（我），柜台职员礼貌地向黄先生询问能否登记资料。", "translation_zh": "“请问在登记这项资料前，我可以知道先生您的全名吗？”柜台人员问黄先生。"}, {"id": "E023", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) perlu membaca soalan pemahaman dengan teliti supaya tidak melakukan kesilapan,\" nasihat Cikgu Tan kepada Wei Lun.", "answer": "Kamu", "distractors": ["Saya", "Dia", "Beliau"], "explanation_zh": "第二人称单数代词（你），陈老师单独指导伟伦要细心阅读理解题。", "translation_zh": "“你必须细心阅读理解题，以免犯下错误。”陈老师劝勉伟伦。"}, {"id": "E024", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Yang di-Pertuan Agong berkenan mengurniakan darjah kebesaran kepada tokoh jasa dan ( ________ ) turut bersalaman dengan penerima.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室尊称（陛下），用于指代国家最高元首（Yang di-Pertuan Agong）。", "translation_zh": "国家元首御准颁赐勋章给有功人士，陛下也与受封者一一握手。"}, {"id": "E025", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) sekalian rakyat jelata berikrar akan terus setia kepada raja dan negara,\" laung wakil rakyat di hadapan istana.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话的国王），代表全体子民向国王宣誓效忠。", "translation_zh": "“我们全体子民宣誓，将永远效忠君主与国家。”民众代表在皇宫前高呼道。"}, {"id": "E026", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Wahai para peserta, ( ________ ) diminta berkumpul di garisan permulaan sekarang,\" umum pengacara sukan.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您/各位），运动会广播员面向参赛者发出正式广播。", "translation_zh": "“各位参赛者，请您现在到起跑线集合。”运动会司仪广播道。"}, {"id": "E027", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Para saintis itu menjalankan penyelidikan bertahun-tahun sehingga ( ________ ) berjaya mencipta vaksin baharu.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“科学家们”（Para saintis）。", "translation_zh": "那些科学家进行了多年的研究，最终他们成功研发出新的疫苗。"}, {"id": "E028", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Sudahkah ( ________ ) bersiap sedia untuk menghadapi ujian lisan Bahasa Melayu esok?\" tanya Mei Hua kepada rakan karibnya, Siti.", "answer": "awak", "distractors": ["saya", "dia", "mereka"], "explanation_zh": "第二人称单数代词（你），美华亲切地问好朋友茜蒂是否已准备好国语口试。", "translation_zh": "“你已经准备好迎接明天的国语口试了吗？”美华问她的挚友茜蒂。"}, {"id": "E029", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Pendeta Za'ba ialah tokoh bahasa yang terkenal dan ( ________ ) banyak menghasilkan buku tatabahasa Melayu.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代马来西亚国宝级语文大师查巴（Pendeta Za'ba）。", "translation_zh": "语文大师查巴是著名的语言学家，他撰写了许多马来文语法书籍。"}, {"id": "E030", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) mesti sentiasa bersyukur atas nikmat keamanan yang dikecapi selama ini,\" kata Cikgu Lim kepada murid-murid.", "answer": "Kita", "distractors": ["Kami", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——包括林老师与学生），提醒大家共同珍惜长久以来的和平。", "translation_zh": "“我们必须时刻感恩长久以来所享有的和平恩典。”林老师对学生们说。"}, {"id": "E031", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Puteri Gunung Ledang dikatakan amat jelita dan ( ________ ) tinggal di puncak gunung yang tinggi.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室/王族尊称（殿下/公主），传统传说中用于指代金山公主（Puteri Gunung Ledang）。", "translation_zh": "据说金山公主容貌极其美丽，殿下居住在高高的山巅之上。"}, {"id": "E032", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Sekiranya ( ________ ) berkenan, patik akan membina sebuah jambatan yang kukuh di sungai itu,\" sembah jurutera istana.", "answer": "tuanku", "distractors": ["beta", "patik", "baginda"], "explanation_zh": "第二人称皇室尊称（陛下），句中有“patik”自称，对苏丹当面请示时用“tuanku”。", "translation_zh": "“若是陛下御准，微臣将在那条河上建造一座坚固的桥梁。”宫廷工程师叩禀道。"}, {"id": "E033", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Oleh sebab rakyat beta sedang dilanda kesusahan, ( ________ ) mengarahkan agar bantuan makanan diagihkan segera,\" titah Raja.", "answer": "beta", "distractors": ["patik", "tuanku", "baginda"], "explanation_zh": "第一人称皇室自称（朕），与前文的“rakyat beta”完全呼应。", "translation_zh": "“由于朕的子民正遭受困难，朕下令立即分发粮食援助。”国王谕示道。"}, {"id": "E034", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Lagu kebangsaan 'Negaraku' sangat bermakna kerana ( ________ ) melambangkan kedaulatan negara kita.", "answer": "ia", "distractors": ["dia", "beliau", "mereka"], "explanation_zh": "第三人称单数代词（它），指代国歌《Negaraku》（非人类事物）。", "translation_zh": "国歌《我的国家》意义深远，因为它象征着我国的主权。"}, {"id": "E035", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) berazam untuk mendapat keputusan A dalam semua mata pelajaran UASA tahun ini,\" kata Zi Kang dengan yakin.", "answer": "Saya", "distractors": ["Kamu", "Dia", "Beliau"], "explanation_zh": "第一人称单数代词（我），子康充满信心地立下今年UASA评估考全A的志愿。", "translation_zh": "“我立志在今年UASA评估考试的所有科目中都考获A等成绩。”子康自信地说。"}, {"id": "E036", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Pelajar cemerlang itu menerima anugerah daripada pihak sekolah kerana ( ________ ) aktif dalam bidang akademik dan kokurikulum.", "answer": "dia", "distractors": ["beliau", "baginda", "mereka"], "explanation_zh": "第三人称单数代词（他/她），指代在校获得表扬的优秀学生（Pelajar cemerlang）。", "translation_zh": "那位优秀生获得了校方颁发的奖项，因为他在学术和课外活动方面都很活跃。"}, {"id": "E037", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Janganlah ( ________ ) mudah berputus asa walaupun menghadapi rintangan dalam pelajaran,\" pesan ibu kepada adik-beradik itu.", "answer": "kalian", "distractors": ["kami", "mereka", "kita"], "explanation_zh": "第二人称复数代词（你们），妈妈勉励兄弟姐妹们不要轻易放弃学业。", "translation_zh": "“即使在学习上遇到阻碍，你们也不要轻易放弃。”妈妈叮嘱那几个兄弟姐妹。"}, {"id": "E038", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Ampun tuanku, ( ________ ) menjunjung kasih atas kurniaan anugerah ini,\" sembah Datuk Shahbandar.", "answer": "patik", "distractors": ["beta", "tuanku", "saya"], "explanation_zh": "第一人称谦称代词（微臣），港务大臣受封后向苏丹谢恩时自称“patik”。", "translation_zh": "“启禀陛下，微臣感激陛下赐予此项殊荣。”拿督港务大臣叩谢道。"}, {"id": "E039", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Cikgu Azizi merupakan jurulatih pasukan olahraga sekolah dan ( ________ ) telah melatih ramai atlet berjaya.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），指代受人敬重的学校田径队教练阿齐兹老师。", "translation_zh": "阿齐兹老师是学校田径队的教练，他培养了许多成功的运动员。"}, {"id": "E040", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Mari ( ________ ) mulakan mesyuarat kelab komputer kita sekarang,\" kata pengerusi kepada ahli jawatankuasa.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括主席与全体委员），提议大家现在开始开会。", "translation_zh": "“让我们现在开始电脑学会的会议吧。”主席对委员们说。"}, {"id": "E041", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Pelajar-pelajar pertukaran dari Jepun itu sangat kagum dengan budaya Malaysia dan ( ________ ) suka makan nasi lemak.", "answer": "mereka", "distractors": ["kami", "kita", "kalian"], "explanation_zh": "第三人称复数代词（他们），指代“来自日本的交换生们”（Pelajar-pelajar）。", "translation_zh": "那些来自日本的交换生对马来西亚文化赞叹不已，他们很喜欢吃椰浆饭。"}, {"id": "E042", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Bilakah ( ________ ) akan memulangkan buku rujukan sejarah yang dipinjam minggu lepas?\" tanya pustakawan kepada murid itu.", "answer": "kamu", "distractors": ["saya", "dia", "kalian"], "explanation_zh": "第二人称单数代词（你），图书管理员询问那位同学何时归还历史参考书。", "translation_zh": "“你什么时候归还上星期借的历史参考书？”图书管理员问那位学生。"}, {"id": "E043", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"( ________ ) sepasukan telah berlatih selama tiga bulan untuk pertandingan koir ini,\" kata ketua pasukan koir sekolah.", "answer": "Kami", "distractors": ["Kita", "Mereka", "Kalian"], "explanation_zh": "第一人称复数代词（我们——不包括听话者），合唱团团长说明全队已训练了三个月。", "translation_zh": "“我们全队为了这次合唱比赛已经练习了三个月。”学校合唱团团长说道。"}, {"id": "E044", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Tengku Mahkota telah melawat mangsa banjir di pusat pemindahan sementara dan ( ________ ) turut menyampaikan bantuan.", "answer": "baginda", "distractors": ["beliau", "beta", "tuanku"], "explanation_zh": "第三人称皇室尊称（殿下），用于指代王储（Tengku Mahkota）。", "translation_zh": "王储殿下前往临时疏散中心探望水灾灾民，殿下也亲自派发了援助品。"}, {"id": "E045", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Jika ( ________ ) ingin menyertai pertandingan pidato ini, sila daftarkan nama sebelum hari Jumaat,\" maklum poster sekolah.", "answer": "anda", "distractors": ["saya", "beliau", "mereka"], "explanation_zh": "第二人称正式代词（您），学校海报面向所有有兴趣报名的学生发出通知。", "translation_zh": "“如果您想参加这项演讲比赛，请在星期五前报名。”学校海报通知道。"}, {"id": "E046", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Mengapakah ( ________ ) tidak datang ke rumahku semalam, Amir?\" tanya Haris kepada sahabat karibnya.", "answer": "engkau", "distractors": ["aku", "dia", "beliau"], "explanation_zh": "第二人称单数代词（你），句末的“rumahku”（我家）提示两人是亲密好友对话，故用“engkau”。", "translation_zh": "“阿米尔，你昨天为什么没有来我家？”哈里斯问他的挚友。"}, {"id": "E047", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Maafkan aku, Haris. Semalam ( ________ ) terpaksa menemani nenek ke klinik,\" jawab Amir.", "answer": "aku", "distractors": ["kamu", "dia", "beliau"], "explanation_zh": "第一人称单数代词（我），阿米尔回应挚友哈里斯时用对应的“aku”。", "translation_zh": "“对不起，哈里斯。昨天我必须陪奶奶去诊所。”阿米尔回答道。"}, {"id": "E048", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "Tun Razak dikenali sebagai Bapa Pembangunan kerana ( ________ ) banyak memajukan kawasan luar bandar.", "answer": "beliau", "distractors": ["dia", "baginda", "mereka"], "explanation_zh": "第三人称尊称代词（他），用于指代受人敬重的前首相敦拉萨（发展之父）。", "translation_zh": "敦拉萨被称为“发展之父”，因为他大力推动了乡区的发展。"}, {"id": "E049", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Izinkan ( ________ ) membentangkan hasil perbincangan kumpulan kami di hadapan kelas,\" kata wakil kumpulan tiga.", "answer": "saya", "distractors": ["kamu", "dia", "mereka"], "explanation_zh": "第一人称单数代词（我），第三组代表请求由“我”在全班面前呈现小组讨论结果。", "translation_zh": "“请允许我在班上呈报我们小组的讨论结果。”第三组代表说道。"}, {"id": "E050", "group": "E", "category": "Group E: Istana & Lanjutan (皇室与进阶)", "sentence": "\"Sebagai anak yang soleh dan berakhlak mulia, ( ________ ) hendaklah sentiasa mendoakan kesejahteraan ibu bapa,\" pesan ustaz.", "answer": "kita", "distractors": ["kami", "mereka", "kalian"], "explanation_zh": "第一人称复数代词（我们——包括说话者与听话者），教导大家应时刻为父母祈福。", "translation_zh": "“作为孝顺且品德高尚的孩子，我们应当经常为父母的安康祈福。”宗教师叮嘱道。"}]
